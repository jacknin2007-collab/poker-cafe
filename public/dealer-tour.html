<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Dealer Tour – Golden Coffee</title>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="GC Dealer Tour"/>
<meta name="theme-color" content="#006633"/>
<style>
:root{--green:#006633;--text:#fff;--text2:#ddd;--gold:#f0c040;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100vw;height:100vh;overflow:hidden;background:var(--green);font-family:-apple-system,sans-serif;}
body{display:flex;flex-direction:column;}

#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:24px;background:var(--green);}
.login-logo{width:80px;height:80px;object-fit:contain;margin-bottom:16px;}
.login-title{font-size:28px;font-weight:900;color:#fff;margin-bottom:8px;}
.login-sub{font-size:12px;color:rgba(255,255,255,0.7);margin-bottom:24px;}
.login-box{background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.3);border-radius:12px;padding:24px;width:100%;max-width:360px;}
select{width:100%;padding:12px;font-size:15px;border:1px solid rgba(255,255,255,0.3);border-radius:8px;background:rgba(0,0,0,0.3);color:#fff;font-family:inherit;margin-bottom:12px;outline:none;}
select option{background:#006633;color:#fff;}
.btn{width:100%;padding:12px;font-size:15px;font-weight:700;border:none;border-radius:8px;background:var(--gold);color:#000;cursor:pointer;font-family:inherit;}
.btn:active{opacity:0.8;}
.btn-logout{width:auto;padding:8px 16px;font-size:12px;}
.err{color:#ff6666;font-size:13px;margin-bottom:8px;min-height:18px;}

/* PASSWORD MODAL */
.pwd-modal{display:flex;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:9999;align-items:center;justify-content:center;}
.pwd-modal.hidden{display:none;}
.pwd-modal-content{background:#1a1a1a;border:2px solid var(--gold);border-radius:12px;padding:40px;width:90%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,0.8);}
.pwd-modal-title{font-size:24px;font-weight:800;color:var(--gold);text-align:center;margin-bottom:8px;}
.pwd-modal-subtitle{font-size:13px;color:var(--text2);text-align:center;margin-bottom:24px;}
.pwd-input{width:100%;padding:12px 16px;font-size:16px;border:1px solid rgba(255,255,255,0.2);border-radius:8px;background:rgba(255,255,255,0.1);color:#fff;font-family:inherit;margin-bottom:16px;outline:none;letter-spacing:0.1em;}
.pwd-input:focus{border-color:var(--gold);box-shadow:0 0 8px rgba(240,192,64,0.3);}
.pwd-btn{width:100%;padding:12px;font-size:14px;font-weight:700;border:none;border-radius:8px;background:var(--gold);color:#000;cursor:pointer;font-family:inherit;}
.pwd-error{color:#ff6666;font-size:12px;margin-top:8px;text-align:center;font-weight:600;}

/* MAIN SCREEN */
#main-screen{display:none;width:100vw;height:100vh;background:var(--green);overflow:hidden;position:relative;}
.top-bar{position:absolute;top:0;left:0;right:0;background:rgba(0,0,0,0.3);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;z-index:10;color:#fff;}
.dealer-name{font-size:16px;font-weight:700;}
.logout-btn{background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;}

/* POKER TABLE CONTAINER */
.table-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:40px 20px;overflow:auto;}

/* ROUND TABLE WITH 9 SEATS */
.poker-table{position:relative;width:90vmin;max-width:100vh;aspect-ratio:1;background:radial-gradient(circle,#004d1a 0%,var(--green) 100%);border:8px solid #8b6914;border-radius:50%;box-shadow:0 20px 60px rgba(0,0,0,0.5),inset 0 0 30px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;}

/* CENTER TIMER - PILL SHAPE */
.timer-center{position:absolute;width:32%;aspect-ratio:0.65;background:rgba(0,0,0,0.4);border:3px solid var(--gold);border-radius:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;}
.timer-display{font-size:72px;font-weight:900;color:var(--gold);font-family:monospace;letter-spacing:2px;line-height:1;}
.timer-display.warn{color:#ff8c00;animation:none;}
.timer-display.blink{color:#ff8c00;animation:blink-timer 0.4s step-end infinite;}
.timer-display.danger{color:#ff2020;animation:vibrate-timer 0.1s infinite;}
@keyframes blink-timer{0%,49%{opacity:1;}50%,100%{opacity:0.3;}}
@keyframes vibrate-timer{0%{transform:translateX(2px);}50%{transform:translateX(-2px);}100%{transform:translateX(0);}}
.timer-label{font-size:12px;color:rgba(255,255,255,0.5);margin-top:4px;}

/* DEALER SETTINGS (TOP CENTER) */
.dealer-settings{position:absolute;top:10%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.5);border:2px solid var(--gold);border-radius:8px;padding:12px;display:flex;gap:8px;align-items:center;z-index:15;min-width:280px;flex-wrap:wrap;justify-content:center;}
.timer-input{width:60px;padding:6px;font-size:14px;text-align:center;background:rgba(0,0,0,0.7);border:1px solid var(--gold);border-radius:6px;color:var(--gold);font-family:monospace;font-weight:700;}
.timer-btn{padding:6px 12px;font-size:12px;font-weight:700;background:var(--gold);color:#000;border:none;border-radius:6px;cursor:pointer;}
.timer-info{font-size:10px;color:rgba(255,255,255,0.6);width:100%;text-align:center;margin-top:4px;}

/* 9 SEATS AROUND TABLE */
.seat{position:absolute;width:14%;aspect-ratio:1;background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.3);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;padding:6px;}
.seat:hover{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.5);}
.seat.occ{background:rgba(0,102,51,0.3);border-color:var(--gold);}
.seat-num{font-size:11px;color:rgba(255,255,255,0.7);font-weight:700;}
.seat-name{font-size:11px;color:#fff;font-weight:700;text-align:center;margin:2px 0;}
.seat-phone{font-size:9px;color:var(--text2);}

/* SEAT POSITIONS (9 seats in circle) */
.seat:nth-child(1){top:2%;left:50%;transform:translateX(-50%);}
.seat:nth-child(2){top:10%;right:8%;transform:translateX(0);}
.seat:nth-child(3){top:27%;right:2%;transform:translateX(0);}
.seat:nth-child(4){top:50%;right:2%;transform:translateY(-50%);}
.seat:nth-child(5){top:73%;right:2%;transform:translateX(0);}
.seat:nth-child(6){top:90%;right:8%;transform:translateX(0);}
.seat:nth-child(7){top:98%;left:50%;transform:translateX(-50%);}
.seat:nth-child(8){top:90%;left:8%;transform:translateX(0);}
.seat:nth-child(9){top:73%;left:2%;transform:translateX(0);}

/* HIDE BY DEFAULT */
@media(orientation:portrait){
  body::after{content:'';position:fixed;inset:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;text-align:center;z-index:9999;pointer-events:none;line-height:1.5;}
}
</style>
</head>
<body>

<div class="pwd-modal" id="pwd-modal">
  <div class="pwd-modal-content">
    <div class="pwd-modal-title">🔐 Bảo vệ</div>
    <div class="pwd-modal-subtitle">Nhập mật khẩu để tiếp tục</div>
    <input type="password" class="pwd-input" id="pwd-input" placeholder="Mật khẩu" autocomplete="off" onkeydown="if(event.key==='Enter')checkPwd()"/>
    <button class="pwd-btn" onclick="checkPwd()">Tiếp tục</button>
    <div class="pwd-error" id="pwd-error"></div>
  </div>
</div>

<div id="login-screen">
  <img src="/logo.png" class="login-logo" alt="Logo" onerror="this.style.display='none'"/>
  <div class="login-title">Golden Coffee</div>
  <div class="login-sub">DEALER TOUR</div>
  <div class="login-box">
    <select id="dealer-select"><option value="">-- Chọn Dealer --</option></select>
    <div class="err" id="login-err"></div>
    <button class="btn" onclick="doLogin()">👤 Tiếp tục</button>
  </div>
</div>

<div id="main-screen">
  <div class="top-bar">
    <div class="dealer-name" id="dealer-name">Dealer</div>
    <button class="logout-btn" onclick="doLogout()">Thoát</button>
  </div>

  <div class="dealer-settings">
    <label style="font-size:12px;color:#fff;">Giây:</label>
    <input type="number" class="timer-input" id="timer-input" value="30" min="5" max="300"/>
    <button class="timer-btn" onclick="setTimerDuration()">Đặt</button>
    <div class="timer-info">💡 Vuốt để reset | Nhấn đúp để dừng</div>
  </div>

  <div class="table-container">
    <div class="poker-table" id="poker-table">
      <div class="timer-center" id="timer-center" ondblclick="togglePauseTimer()">
        <div class="timer-display" id="timer-display">00:30</div>
        <div class="timer-label">Thời gian</div>
      </div>
    </div>
  </div>
</div>

<script>
const PASSWORD='19842007';
function checkPwd(){
  const pwd=document.getElementById('pwd-input').value;
  if(pwd===PASSWORD){
    sessionStorage.setItem('pwd-auth','1');
    document.getElementById('pwd-modal').classList.add('hidden');
  } else {
    document.getElementById('pwd-error').textContent='Sai mật khẩu!';
    document.getElementById('pwd-input').value='';
    document.getElementById('pwd-input').focus();
  }
}
window.addEventListener('load',()=>{
  if(!sessionStorage.getItem('pwd-auth')){
    document.getElementById('pwd-modal').classList.remove('hidden');
    setTimeout(()=>document.getElementById('pwd-input').focus(),100);
  } else {
    document.getElementById('pwd-modal').classList.add('hidden');
  }
});

const API='https://poker-cafe.onrender.com/api';
let dealerName='',tableState=null,allCustomers=[],timerDuration=30,timerRemain=30,timerRunning=false;
let timerInterval=null,pollTimer=null,lastTouchX=0;

async function api(path){
  try{
    const r=await fetch(API+path,{signal:AbortSignal.timeout(6000)});
    return await r.json();
  }catch(e){return null;}
}

async function initLogin(){
  const dealers=await api('/dealers');
  if(!dealers)return;
  const sel=document.getElementById('dealer-select');
  dealers.forEach(d=>{
    const o=document.createElement('option');
    o.value=d.name;
    o.textContent=d.name;
    sel.appendChild(o);
  });
}

function doLogin(){
  const val=document.getElementById('dealer-select').value;
  if(!val){document.getElementById('login-err').textContent='Chọn dealer!';return;}
  dealerName=val;
  document.getElementById('login-screen').style.display='none';
  document.getElementById('main-screen').style.display='flex';
  document.getElementById('dealer-name').textContent=dealerName;
  screen.orientation.lock('landscape').catch(()=>{});
  loadAll();
  startTimer();
  pollTimer=setInterval(loadState,2000);
}

function doLogout(){
  clearInterval(pollTimer);
  clearInterval(timerInterval);
  dealerName='';timerRunning=false;
  document.getElementById('main-screen').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  screen.orientation.unlock();
}

async function loadAll(){
  const custs=await api('/customers');
  if(custs)allCustomers=custs;
  await loadState();
}

async function loadState(){
  const state=await api('/table-state');
  if(!state)return;
  tableState=state;
  renderSeats();
}

function getCustomerPhone(name){
  const c=allCustomers.find(x=>x.name===name);
  return c?('···'+c.phone.slice(-4)):'';
}

function renderSeats(){
  if(!tableState)return;
  const tourTables=tableState.tablesTour||[];
  const allSeats=[];
  tourTables.forEach(t=>{if(t.status==='active')allSeats.push(...(t.seats||[]));});
  const table=document.getElementById('poker-table');
  const existing=table.querySelectorAll('.seat');
  existing.forEach(s=>s.remove());
  
  for(let i=0;i<9;i++){
    const seat=document.createElement('div');
    seat.className='seat'+(allSeats[i]?' occ':'');
    const phone=allSeats[i]?getCustomerPhone(allSeats[i]):'';
    seat.innerHTML=`<div class="seat-num">G${i+1}</div>
      ${allSeats[i]?`<div class="seat-name">${allSeats[i]}</div><div class="seat-phone">${phone}</div>`:'<div class="seat-name" style="color:rgba(255,255,255,0.5);">Trống</div>'}`;
    table.appendChild(seat);
  }
}

function startTimer(){
  stopSound();
  timerRemain=timerDuration;
  timerRunning=true;
  updateDisplay();
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    if(!timerRunning)return;
    timerRemain--;
    updateDisplay();
    if(timerRemain===10)navigator.vibrate([200,100,200]);
    if(timerRemain<=3&&timerRemain>0)navigator.vibrate([100,50,100,50,100]);
    if(timerRemain===0){timerRunning=false;playSound();}
  },1000);
}

function updateDisplay(){
  const el=document.getElementById('timer-display');
  const m=Math.floor(timerRemain/60);
  const s=timerRemain%60;
  el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  let className='timer-display';
  if(timerRemain<=3&&timerRemain>0)className+=' danger';
  else if(timerRemain===10)className+=' blink';
  else if(timerRemain<10&&timerRemain>3)className+=' warn';
  el.className=className;
}

function setTimerDuration(){
  const val=parseInt(document.getElementById('timer-input').value)||30;
  if(val<5||val>300){alert('5-300 giây!');return;}
  timerDuration=val;
  startTimer();
}

function togglePauseTimer(){
  timerRunning=!timerRunning;
}

let soundBeepInterval=null;
function playSound(){
  const ctx=new(window.AudioContext||window.webkitAudioContext)();
  function beep(){
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.frequency.value=1200;
    o.connect(g);g.connect(ctx.destination);
    g.gain.setValueAtTime(0.3,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.15);
    o.start();o.stop(ctx.currentTime+0.15);
  }
  beep();
  soundBeepInterval=setInterval(beep,300);
}
function stopSound(){
  if(soundBeepInterval){clearInterval(soundBeepInterval);soundBeepInterval=null;}
}

document.addEventListener('touchstart',e=>{lastTouchX=e.touches[0].clientX;});
document.addEventListener('touchend',e=>{
  const diff=Math.abs(e.changedTouches[0].clientX-lastTouchX);
  if(diff>80)startTimer();
});

initLogin();
</script>
</body>
</html>
