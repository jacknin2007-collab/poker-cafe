<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Dealer Tour – Golden Coffee</title>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="GC Dealer Tour"/>
<meta name="theme-color" content="#006633"/>
<style>
:root{--green:#006633;--text:#fff;--red:#ff2020;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100vw;height:100vh;overflow:hidden;background:var(--green);font-family:-apple-system,sans-serif;}
body{display:flex;flex-direction:column;}

#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:24px;background:var(--green);}
.login-logo{width:80px;height:80px;object-fit:contain;margin-bottom:16px;}
.login-title{font-size:28px;font-weight:900;color:#fff;margin-bottom:8px;}
.login-sub{font-size:12px;color:rgba(255,255,255,0.7);margin-bottom:24px;}
.login-box{background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.3);border-radius:12px;padding:24px;width:100%;max-width:360px;}
select{width:100%;padding:12px;font-size:15px;border:1px solid rgba(255,255,255,0.3);border-radius:8px;background:rgba(0,0,0,0.3);color:#fff;font-family:inherit;margin-bottom:12px;outline:none;}
select option{background:#006633;color:#fff;}
.btn{width:100%;padding:12px;font-size:15px;font-weight:700;border:none;border-radius:8px;background:#f0c040;color:#000;cursor:pointer;font-family:inherit;}
.btn:active{opacity:0.8;}
.logout-btn{width:auto;padding:8px 16px;font-size:12px;}
.err{color:#ff6666;font-size:13px;margin-bottom:8px;min-height:18px;}

/* PASSWORD MODAL */
.pwd-modal{display:flex;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:9999;align-items:center;justify-content:center;}
.pwd-modal.hidden{display:none;}
.pwd-modal-content{background:#1a1a1a;border:2px solid #f0c040;border-radius:12px;padding:40px;width:90%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,0.8);}
.pwd-modal-title{font-size:24px;font-weight:800;color:#f0c040;text-align:center;margin-bottom:8px;}
.pwd-modal-subtitle{font-size:13px;color:#ddd;text-align:center;margin-bottom:24px;}
.pwd-input{width:100%;padding:12px 16px;font-size:16px;border:1px solid rgba(255,255,255,0.2);border-radius:8px;background:rgba(255,255,255,0.1);color:#fff;font-family:inherit;margin-bottom:16px;outline:none;letter-spacing:0.1em;}
.pwd-input:focus{border-color:#f0c040;box-shadow:0 0 8px rgba(240,192,64,0.3);}
.pwd-btn{width:100%;padding:12px;font-size:14px;font-weight:700;border:none;border-radius:8px;background:#f0c040;color:#000;cursor:pointer;font-family:inherit;}
.pwd-error{color:#ff6666;font-size:12px;margin-top:8px;text-align:center;font-weight:600;}

/* MAIN SCREEN */
#main-screen{display:none;width:100vw;height:100vh;background:var(--green);overflow:hidden;position:relative;}
.top-bar{position:absolute;top:0;left:0;right:0;background:rgba(0,0,0,0.3);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;z-index:10;color:#fff;font-size:16px;font-weight:700;}
.logout-btn{background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;}

/* TABLE CONTAINER */
.table-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;}

/* POKER TABLE - PILL SHAPE */
.poker-table{position:relative;width:85%;max-width:900px;aspect-ratio:1.8;background:linear-gradient(135deg, #004d1a 0%, var(--green) 100%);border:6px solid #8b6914;border-radius:200px;box-shadow:0 20px 60px rgba(0,0,0,0.5),inset 0 0 30px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;}

/* TIMER CENTER - OVAL */
.timer-center{position:absolute;width:20%;aspect-ratio:1.2;background:rgba(0,0,0,0.5);border:3px solid #f0c040;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:20;cursor:pointer;}
.timer-display{font-size:80px;font-weight:900;color:var(--red);font-family:monospace;line-height:1;}
.timer-display.warn{color:#ff8c00;}
.timer-display.blink{color:#ff8c00;animation:blink 0.4s step-end infinite;}
.timer-display.danger{color:var(--red);animation:shake 0.1s infinite;}
@keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:0.3;}}
@keyframes shake{0%,100%{transform:translateX(0);}50%{transform:translateX(2px);}}

/* DEALER HEADER */
.dealer-header{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.6);border-radius:8px;padding:10px 16px;display:flex;gap:10px;align-items:center;z-index:15;border:1px solid rgba(255,255,255,0.2);}
.dealer-label{font-size:16px;font-weight:700;color:#fff;font-family:'Bebas Neue',sans-serif;letter-spacing:0.1em;}
.settings-icon{width:30px;height:30px;background:rgba(255,255,255,0.15);border:1.5px solid #f0c040;border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:all 0.2s;}
.settings-icon:hover{background:rgba(255,255,255,0.25);}

/* SETTINGS MODAL */
.settings-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:100;align-items:center;justify-content:center;}
.settings-modal.show{display:flex;}
.settings-content{background:rgba(0,0,0,0.7);border:2px solid #f0c040;border-radius:12px;padding:24px;max-width:300px;text-align:center;}
.settings-title{font-size:18px;font-weight:700;color:#fff;margin-bottom:16px;}
.settings-input{width:100%;padding:12px;font-size:28px;text-align:center;background:rgba(255,255,255,0.05);border:2px solid #f0c040;border-radius:8px;color:#f0c040;font-family:monospace;font-weight:700;margin-bottom:12px;}
.settings-btn{width:100%;padding:10px;font-size:14px;font-weight:700;background:#f0c040;color:#000;border:none;border-radius:8px;cursor:pointer;margin-bottom:8px;}
.settings-btn-close{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);}

/* 9 SEATS - DARK CIRCLES */
.seat{position:absolute;width:12%;aspect-ratio:1;background:#001a0d;border:2px solid #004d1a;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700;cursor:pointer;transition:all 0.2s;overflow:hidden;padding:4px;text-align:center;word-break:break-word;}
.seat:hover{background:#003d1a;border-color:#008844;}
.seat.occ{background:#228844;border-color:#44ff66;box-shadow:0 0 15px rgba(68,255,102,0.6);}
.seat-player{font-size:10px;font-weight:700;line-height:1.1;}
.seat-phone{font-size:8px;opacity:0.8;line-height:1.1;}

/* SEAT POSITIONS */
.seat:nth-child(1){top:5%;left:50%;transform:translateX(-50%);}
.seat:nth-child(2){top:18%;right:6%;transform:translateY(-50%);}
.seat:nth-child(3){top:35%;right:2%;transform:translateY(-50%);}
.seat:nth-child(4){top:50%;right:0%;transform:translateY(-50%);}
.seat:nth-child(5){top:65%;right:2%;transform:translateY(-50%);}
.seat:nth-child(6){top:82%;right:6%;transform:translateY(-50%);}
.seat:nth-child(7){top:95%;left:50%;transform:translateX(-50%);}
.seat:nth-child(8){top:82%;left:6%;transform:translateY(-50%);}
.seat:nth-child(9){top:65%;left:2%;transform:translateY(-50%);}
.seat:nth-child(10){top:50%;left:0%;transform:translateY(-50%);}
.seat:nth-child(11){top:35%;left:2%;transform:translateY(-50%);}
.seat:nth-child(12){top:18%;left:6%;transform:translateY(-50%);}

@media(orientation:portrait){
  body::after{content:'Vui lòng xoay ngang màn hình';position:fixed;inset:0;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;z-index:9999;pointer-events:none;}
}
</style>
</head>
<body>

<div class="pwd-modal" id="pwd-modal">
  <div class="pwd-modal-content">
    <div class="pwd-modal-title">🔐 Bảo vệ</div>
    <div class="pwd-modal-subtitle">Nhập mật khẩu để tiếp tục</div>
    <input type="password" class="pwd-input" id="pwd-input" placeholder="Mật khẩu" autocomplete="off" onkeydown="if(event.key==='Enter')checkPwd()"/>
    <button class="pwd-btn" onclick="checkPwd()">Tiếp tục</button>
    <div class="pwd-error" id="pwd-error"></div>
  </div>
</div>

<div id="login-screen">
  <img src="/logo.png" class="login-logo" alt="Logo" onerror="this.style.display='none'"/>
  <div class="login-title">Golden Coffee</div>
  <div class="login-sub">DEALER TOUR</div>
  <div class="login-box">
    <select id="dealer-select"><option value="">-- Chọn Dealer --</option></select>
    <div class="err" id="login-err"></div>
    <button class="btn" onclick="doLogin()">👤 Tiếp tục</button>
  </div>
</div>

<div id="main-screen">
  <div class="top-bar">
    <div id="dealer-name-top">Dealer 1</div>
    <button class="logout-btn" onclick="doLogout()">Thoát</button>
  </div>

  <div class="dealer-header">
    <div class="dealer-label" id="dealer-name-header">Dealer 1</div>
    <div class="settings-icon" onclick="openSettings()">⚙️</div>
  </div>

  <div class="settings-modal" id="settings-modal">
    <div class="settings-content">
      <div class="settings-title">⏱️ Thời gian</div>
      <input type="number" class="settings-input" id="timer-input" value="30" min="5" max="300"/>
      <button class="settings-btn" onclick="setTimerDuration()">✓ Đặt</button>
      <button class="settings-btn settings-btn-close" onclick="closeSettings()">✕ Đóng</button>
    </div>
  </div>

  <div class="settings-modal" id="remove-player-modal">
    <div class="settings-content">
      <div class="settings-title">⚠️ Loại người chơi</div>
      <div id="remove-player-name" style="font-size:14px;color:#fff;margin-bottom:16px;"></div>
      <button class="settings-btn" style="background:#ff4444;" onclick="confirmRemovePlayer()">🗑️ Loại</button>
      <button class="settings-btn settings-btn-close" onclick="closeRemoveModal()">✕ Hủy</button>
    </div>
  </div>

  <div class="table-container">
    <div class="poker-table" id="poker-table">
      <div class="timer-center" id="timer-center" ondblclick="togglePauseTimer()">
        <div class="timer-display" id="timer-display">30</div>
      </div>
    </div>
  </div>
</div>

<script>
const PASSWORD='19842007';
function checkPwd(){
  const pwd=document.getElementById('pwd-input').value;
  if(pwd===PASSWORD){
    sessionStorage.setItem('pwd-auth','1');
    document.getElementById('pwd-modal').classList.add('hidden');
    document.getElementById('login-screen').style.display='none';
    document.getElementById('main-screen').style.display='flex';
    initApp();
  } else {
    document.getElementById('pwd-error').textContent='Sai mật khẩu!';
    document.getElementById('pwd-input').value='';
    document.getElementById('pwd-input').focus();
  }
}

window.addEventListener('load',()=>{
  if(sessionStorage.getItem('pwd-auth')){
    document.getElementById('pwd-modal').classList.add('hidden');
    document.getElementById('login-screen').style.display='none';
    document.getElementById('main-screen').style.display='flex';
    initApp();
  } else {
    document.getElementById('pwd-modal').classList.remove('hidden');
    setTimeout(()=>document.getElementById('pwd-input').focus(),100);
  }
});

const API='https://poker-cafe.onrender.com/api';
let dealerName='',tableState=null,allCustomers=[],timerDuration=30,timerRemain=30,timerRunning=false;
let timerInterval=null,pollTimer=null,lastTouchX=0,soundBeepInterval=null,vibrationInterval=null;
let selectedPlayerName='',selectedSeatIndex=-1;
const audioCtx=new(window.AudioContext||window.webkitAudioContext)();

async function api(path){
  try{const r=await fetch(API+path,{signal:AbortSignal.timeout(6000)});return await r.json();}catch(e){return null;}
}

async function initLogin(){
  const dealers=await api('/dealers');
  if(!dealers)return;
  const sel=document.getElementById('dealer-select');
  dealers.forEach(d=>{const o=document.createElement('option');o.value=d.name;o.textContent=d.name;sel.appendChild(o);});
}

function doLogin(){
  const val=document.getElementById('dealer-select').value;
  if(!val){document.getElementById('login-err').textContent='Chọn dealer!';return;}
  dealerName=val;
  document.getElementById('login-screen').style.display='none';
  document.getElementById('main-screen').style.display='flex';
  document.getElementById('dealer-name-top').textContent=dealerName;
  document.getElementById('dealer-name-header').textContent=dealerName;
  document.getElementById('timer-input').value='30';
  closeSettings();
  screen.orientation.lock('landscape').catch(()=>{});
  initApp();
}

function doLogout(){
  clearInterval(pollTimer);
  clearInterval(timerInterval);
  stopSound();
  stopVibration();
  dealerName='';timerRunning=false;
  document.getElementById('main-screen').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('pwd-modal').classList.remove('hidden');
  document.getElementById('pwd-input').value='';
  document.getElementById('pwd-input').focus();
  screen.orientation.unlock();
}

function initApp(){
  loadAll();
  startTimer();
  pollTimer=setInterval(loadState,2000);
}

async function loadAll(){
  const custs=await api('/customers');
  if(custs)allCustomers=custs;
  await loadState();
}

async function loadState(){
  const state=await api('/table-state');
  if(!state)return;
  tableState=state;
  renderSeats();
}

function getCustomerPhone(name){
  const c=allCustomers.find(x=>x.name===name);
  return c?('···'+c.phone.slice(-4)):'';
}

function renderSeats(){
  if(!tableState)return;
  const tourTables=tableState.tablesTour||[];
  const allSeats=[];
  tourTables.forEach(t=>{if(t.status==='active')allSeats.push(...(t.seats||[]));});
  const table=document.getElementById('poker-table');
  const existing=table.querySelectorAll('.seat');
  existing.forEach(s=>s.remove());

  for(let i=0;i<9;i++){
    const seat=document.createElement('div');
    const playerName=allSeats[i]||'';
    const phone=playerName?getCustomerPhone(playerName):'';

    if(playerName){
      seat.className='seat occ';
      seat.innerHTML=`<div class="seat-player">${playerName}</div><div class="seat-phone">${phone}</div>`;
    } else {
      seat.className='seat';
      seat.textContent='Trống';
    }

    seat.addEventListener('click',()=>{
      if(playerName){
        openRemoveModal(playerName,i);
      }
    });

    table.appendChild(seat);
  }
}

function startTimer(){
  stopSound();
  stopVibration();
  timerRemain=timerDuration;
  timerRunning=true;
  updateDisplay();
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    if(!timerRunning)return;
    timerRemain--;
    updateDisplay();
    if(timerRemain===10)doVibrate([200,100,200]);
    if(timerRemain===3)startContinuousVibration();
    if(timerRemain<3&&timerRemain>0){
      // Tiếp tục rung với doVibrate
    }
    if(timerRemain===0){
      timerRunning=false;
      stopVibration();
      playSound();
    }
  },1000);
}

function startContinuousVibration(){
  stopVibration();
  vibrationInterval=setInterval(()=>{
    doVibrate([150,100]);
  },250);
}

function stopVibration(){
  if(vibrationInterval){
    clearInterval(vibrationInterval);
    vibrationInterval=null;
  }
  doVibrate(0);
}

function doVibrate(pattern){
  if(!navigator.vibrate)return;
  try{
    navigator.vibrate(pattern);
  }catch(e){
    console.log('Vibration not supported:',e);
  }
}

function updateDisplay(){
  const el=document.getElementById('timer-display');
  el.textContent=String(timerRemain);
  let className='timer-display';
  if(timerRemain<=3&&timerRemain>0)className+=' danger';
  else if(timerRemain===10)className+=' blink';
  else if(timerRemain<10&&timerRemain>3)className+=' warn';
  el.className=className;
}

function openSettings(){
  document.getElementById('settings-modal').classList.add('show');
  document.getElementById('timer-input').focus();
}

function closeSettings(){
  document.getElementById('settings-modal').classList.remove('show');
}

function setTimerDuration(){
  const val=parseInt(document.getElementById('timer-input').value)||30;
  if(val<5||val>300){alert('5-300 giây!');return;}
  timerDuration=val;
  closeSettings();
  startTimer();
}

function togglePauseTimer(){
  timerRunning=!timerRunning;
}

function openRemoveModal(playerName,seatIndex){
  selectedPlayerName=playerName;
  selectedSeatIndex=seatIndex;
  document.getElementById('remove-player-name').textContent=playerName;
  document.getElementById('remove-player-modal').classList.add('show');
}

function closeRemoveModal(){
  selectedPlayerName='';
  selectedSeatIndex=-1;
  document.getElementById('remove-player-modal').classList.remove('show');
}

async function confirmRemovePlayer(){
  if(!selectedPlayerName)return;
  const tourTables=tableState.tablesTour||[];
  let activeTableIdx=-1;
  for(let i=0;i<tourTables.length;i++){
    if(tourTables[i].status==='active'){
      activeTableIdx=i;
      break;
    }
  }
  if(activeTableIdx<0)return;

  const table=tourTables[activeTableIdx];
  if(table.seats){
    table.seats[selectedSeatIndex]='';
  }

  try{
    await fetch(API+'/table-state',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(tableState)
    });
    closeRemoveModal();
    await loadState();
  }catch(e){
    console.error(e);
  }
}

function playSound(){
  function beep(){
    try{
      if(audioCtx.state==='suspended'){
        audioCtx.resume().then(()=>doBeep());
      } else {
        doBeep();
      }
    }catch(e){
      console.log('Audio error:',e);
    }
  }

  function doBeep(){
    try{
      const o=audioCtx.createOscillator();
      const g=audioCtx.createGain();
      o.frequency.value=1200;
      o.connect(g);
      g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.3,audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.15);
      o.start();
      o.stop(audioCtx.currentTime+0.15);
    }catch(e){
      console.log('Beep failed:',e);
    }
  }

  beep();
  soundBeepInterval=setInterval(beep,250);
}

function stopSound(){
  if(soundBeepInterval){
    clearInterval(soundBeepInterval);
    soundBeepInterval=null;
  }
}

document.addEventListener('touchstart',e=>{lastTouchX=e.touches[0].clientX;});
document.addEventListener('touchend',e=>{
  const diff=Math.abs(e.changedTouches[0].clientX-lastTouchX);
  if(diff>80){startTimer();stopSound();}
});

// Initialize audio context on any user interaction
['click','touchstart','keydown'].forEach(event=>{
  document.addEventListener(event,()=>{
    if(audioCtx.state==='suspended'){
      audioCtx.resume().catch(e=>console.log('AudioContext resume failed:',e));
    }
  },{once:true});
});

initLogin();
</script>
</body>
</html>
