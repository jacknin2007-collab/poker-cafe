<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Dealer Tour – Golden Coffee</title>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="GC Dealer Tour"/>
<meta name="theme-color" content="#006633"/>
<style>
:root{--green:#006633;--red:#ff2020;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100vw;height:100vh;overflow:hidden;background:var(--green);font-family:-apple-system,sans-serif;}
body{display:flex;flex-direction:column;overflow:hidden;}

.pwd-modal{display:flex;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:9999;align-items:center;justify-content:center;}
.pwd-modal.hidden{display:none;}
.pwd-modal-content{background:#1a1a1a;border:2px solid #f0c040;border-radius:12px;padding:40px;width:90%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,0.8);}
.pwd-modal-title{font-size:24px;font-weight:800;color:#f0c040;text-align:center;margin-bottom:8px;}
.pwd-modal-subtitle{font-size:13px;color:#ddd;text-align:center;margin-bottom:24px;}
.pwd-input{width:100%;padding:12px 16px;font-size:16px;border:1px solid rgba(255,255,255,0.2);border-radius:8px;background:rgba(255,255,255,0.1);color:#fff;font-family:inherit;margin-bottom:16px;outline:none;letter-spacing:0.1em;}
.pwd-input:focus{border-color:#f0c040;box-shadow:0 0 8px rgba(240,192,64,0.3);}
.pwd-btn{width:100%;padding:12px;font-size:14px;font-weight:700;border:none;border-radius:8px;background:#f0c040;color:#000;cursor:pointer;font-family:inherit;}
.pwd-error{color:#ff6666;font-size:12px;margin-top:8px;text-align:center;font-weight:600;}

#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:24px;background:var(--green);}
.login-logo{width:80px;height:80px;object-fit:contain;margin-bottom:16px;}
.login-title{font-size:28px;font-weight:900;color:#fff;margin-bottom:8px;}
.login-sub{font-size:12px;color:rgba(255,255,255,0.7);margin-bottom:24px;}
.login-box{background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.3);border-radius:12px;padding:24px;width:100%;max-width:360px;}
select{width:100%;padding:12px;font-size:15px;border:1px solid rgba(255,255,255,0.3);border-radius:8px;background:rgba(0,0,0,0.3);color:#fff;font-family:inherit;margin-bottom:12px;outline:none;}
select option{background:#006633;color:#fff;}
.btn{width:100%;padding:12px;font-size:15px;font-weight:700;border:none;border-radius:8px;background:#f0c040;color:#000;cursor:pointer;font-family:inherit;}
.btn:active{opacity:0.8;}
.err{color:#ff6666;font-size:13px;margin-bottom:8px;min-height:18px;}

#main-screen{display:none;width:100vw;height:100vh;background:var(--green);overflow:hidden;position:relative;flex-direction:column;}

.top-bar{width:100%;height:50px;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:10;}
.dealer-name-left{color:#fff;font-size:16px;font-weight:700;}
.dealer-center{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,0.6);padding:8px 16px;border-radius:6px;}
.dealer-label{color:#fff;font-size:14px;font-weight:700;}
.settings-icon{width:30px;height:30px;background:rgba(255,255,255,0.15);border:1.5px solid #f0c040;border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:all 0.2s;}
.settings-icon:hover{background:rgba(255,255,255,0.25);}
.logout-btn{background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:8px 16px;border-radius:6px;font-size:12px;cursor:pointer;font-weight:700;}

.main-content{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;}
.table-wrapper{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}

svg{max-width:100%;max-height:100%;display:block;}

.seat-circle{cursor:pointer;transition:all 0.2s;}
.seat-circle:hover{filter:brightness(1.2);}
.seat-circle.occ{filter:brightness(1.3);}

.seat-label{font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:middle;fill:#fff;pointer-events:none;}
.seat-info{pointer-events:none;font-size:9px;text-anchor:middle;fill:#fff;opacity:0.9;}

.timer-bg{cursor:pointer;}
.timer-text{font-size:60px;font-weight:900;text-anchor:middle;dominant-baseline:middle;fill:var(--red);font-family:monospace;pointer-events:none;}
.timer-text.warn{fill:#ff8c00;animation:none;}
.timer-text.blink{fill:#ff8c00;animation:blink 0.4s step-end infinite;}
.timer-text.danger{fill:var(--red);animation:shake 0.1s infinite;}
@keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:0.3;}}
@keyframes shake{0%,100%{transform:translateX(0);}50%{transform:translateX(2px);}}

.settings-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:100;align-items:center;justify-content:center;}
.settings-modal.show{display:flex;}
.settings-content{background:rgba(0,0,0,0.9);border:2px solid #f0c040;border-radius:12px;padding:24px;max-width:300px;text-align:center;}
.settings-title{font-size:18px;font-weight:700;color:#fff;margin-bottom:16px;}
.settings-input{width:100%;padding:12px;font-size:28px;text-align:center;background:rgba(255,255,255,0.05);border:2px solid #f0c040;border-radius:8px;color:#f0c040;font-family:monospace;font-weight:700;margin-bottom:12px;}
.settings-btn{width:100%;padding:10px;font-size:14px;font-weight:700;background:#f0c040;color:#000;border:none;border-radius:8px;cursor:pointer;margin-bottom:8px;}
.settings-btn-close{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);}

@media(orientation:portrait){
  body::after{content:'Vui lòng xoay ngang màn hình';position:fixed;inset:0;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;z-index:9999;pointer-events:none;}
}
</style>
</head>
<body>

<div class="pwd-modal" id="pwd-modal">
  <div class="pwd-modal-content">
    <div class="pwd-modal-title">🔐 Bảo vệ</div>
    <div class="pwd-modal-subtitle">Nhập mật khẩu để tiếp tục</div>
    <input type="password" class="pwd-input" id="pwd-input" placeholder="Mật khẩu" autocomplete="off" onkeydown="if(event.key==='Enter')checkPwd()"/>
    <button class="pwd-btn" onclick="checkPwd()">Tiếp tục</button>
    <div class="pwd-error" id="pwd-error"></div>
  </div>
</div>

<div id="login-screen">
  <img src="/logo.png" class="login-logo" alt="Logo" onerror="this.style.display='none'"/>
  <div class="login-title">Golden Coffee</div>
  <div class="login-sub">DEALER TOUR</div>
  <div class="login-box">
    <select id="dealer-select"><option value="">-- Chọn Dealer --</option></select>
    <div class="err" id="login-err"></div>
    <button class="btn" onclick="doLogin()">👤 Tiếp tục</button>
  </div>
</div>

<div id="main-screen">
  <div class="top-bar">
    <div class="dealer-name-left" id="dealer-name-left">Dealer 1</div>
    <div class="dealer-center">
      <div class="dealer-label" id="dealer-label">DEALER 1</div>
      <div class="settings-icon" onclick="openSettings()">⚙️</div>
    </div>
    <button class="logout-btn" onclick="doLogout()">Thoát</button>
  </div>

  <div class="main-content">
    <div class="table-wrapper">
      <svg id="table-svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet">
        <!-- Table background (oval) -->
        <defs>
          <linearGradient id="tableGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#004d1a;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#006633;stop-opacity:1" />
          </linearGradient>
        </defs>

        <ellipse cx="500" cy="300" rx="340" ry="210" fill="url(#tableGrad)" stroke="#c9a856" stroke-width="12"/>

        <!-- Seats will be added via JavaScript -->
        <!-- Timer text with invisible rect for double-tap detection -->
        <rect x="420" y="240" width="160" height="120" fill="transparent" id="timer-touch" style="cursor:pointer;"/>
        <text x="500" y="300" class="timer-text" id="timer-text">30</text>
      </svg>
    </div>
  </div>

  <div class="settings-modal" id="settings-modal">
    <div class="settings-content">
      <div class="settings-title">⏱️ Thời gian</div>
      <input type="number" class="settings-input" id="timer-input" value="30" min="5" max="300"/>
      <button class="settings-btn" onclick="setTimerDuration()">✓ Đặt</button>
      <button class="settings-btn settings-btn-close" onclick="closeSettings()">✕ Đóng</button>
    </div>
  </div>

  <div class="settings-modal" id="remove-player-modal">
    <div class="settings-content">
      <div class="settings-title">⚠️ Loại người chơi</div>
      <div id="remove-player-name"></div>
      <button class="settings-btn" style="background:#ff4444;" onclick="confirmRemovePlayer()">🗑️ Loại</button>
      <button class="settings-btn settings-btn-close" onclick="closeRemoveModal()">✕ Hủy</button>
    </div>
  </div>
</div>

<script>
const PASSWORD='19842007';
const API='https://poker-cafe.onrender.com/api';

let dealerName='',tableState=null,allCustomers=[];
let timerDuration=30,timerRemain=30,timerRunning=false;
let timerInterval=null,pollTimer=null,soundBeepInterval=null,vibrationInterval=null;
let selectedPlayerName='',selectedSeatIndex=-1;
let seatElements={};
const audioCtx=new(window.AudioContext||window.webkitAudioContext)();

function checkPwd(){
  const pwd=document.getElementById('pwd-input').value;
  if(pwd===PASSWORD){
    sessionStorage.setItem('pwd-auth','1');
    document.getElementById('pwd-modal').classList.add('hidden');
    document.getElementById('login-screen').style.display='flex';
    initLogin();
  } else {
    document.getElementById('pwd-error').textContent='Sai mật khẩu!';
    document.getElementById('pwd-input').value='';
    document.getElementById('pwd-input').focus();
  }
}

window.addEventListener('load',()=>{
  if(sessionStorage.getItem('pwd-auth')){
    document.getElementById('pwd-modal').classList.add('hidden');
    document.getElementById('login-screen').style.display='none';
    document.getElementById('main-screen').style.display='flex';
    initApp();
  } else {
    document.getElementById('pwd-modal').classList.remove('hidden');
    setTimeout(()=>document.getElementById('pwd-input').focus(),100);
  }
});

async function api(path){
  try{const r=await fetch(API+path,{signal:AbortSignal.timeout(6000)});return await r.json();}catch(e){return null;}
}

async function initLogin(){
  const dealers=await api('/dealers');
  if(!dealers)return;
  const sel=document.getElementById('dealer-select');
  while(sel.options.length > 1) sel.remove(1);
  dealers.forEach(d=>{const o=document.createElement('option');o.value=d.name;o.textContent=d.name;sel.appendChild(o);});
}

function doLogin(){
  const val=document.getElementById('dealer-select').value;
  if(!val){document.getElementById('login-err').textContent='Chọn dealer!';return;}
  dealerName=val;
  document.getElementById('login-screen').style.display='none';
  document.getElementById('main-screen').style.display='flex';
  document.getElementById('dealer-name-left').textContent=dealerName;
  document.getElementById('dealer-label').textContent=dealerName.toUpperCase();
  closeSettings();
  screen.orientation.lock('landscape').catch(()=>{});
  initApp();
}

function doLogout(){
  clearInterval(pollTimer);
  clearInterval(timerInterval);
  stopSound();
  stopVibration();
  dealerName='';timerRunning=false;
  document.getElementById('main-screen').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('pwd-modal').classList.remove('hidden');
  document.getElementById('pwd-input').value='';
  document.getElementById('pwd-input').focus();
  screen.orientation.unlock();
}

function initApp(){
  renderSeats();
  loadAll();
  startTimer();
  pollTimer=setInterval(loadState,2000);
}

async function loadAll(){
  const custs=await api('/customers');
  if(custs)allCustomers=custs;
  await loadState();
}

async function loadState(){
  const state=await api('/table-state');
  if(!state)return;
  tableState=state;
  updateSeats();
}

function getCustomerPhone(name){
  const c=allCustomers.find(x=>x.name===name);
  return c?('···'+c.phone.slice(-4)):'';
}

function renderSeats(){
  const svg=document.getElementById('table-svg');
  const cx=500,cy=300,rx=320,ry=190;

  seatElements={};

  // 9 ghế được sắp xếp quanh oval
  for(let i=0;i<9;i++){
    const angle=(-i*40 + 90)*Math.PI/180; // Bắt đầu từ trên (90°), xoay ngược chiều
    const x=cx+rx*Math.cos(angle);
    const y=cy+ry*Math.sin(angle);

    // Vòng tròn ghế
    const circle=document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx',x);
    circle.setAttribute('cy',y);
    circle.setAttribute('r','45');
    circle.setAttribute('fill','#001a0d');
    circle.setAttribute('stroke','#004d1a');
    circle.setAttribute('stroke-width','2');
    circle.setAttribute('class','seat-circle');
    circle.setAttribute('data-seat',i);
    circle.style.cursor='pointer';

    circle.addEventListener('click',()=>handleSeatClick(i));

    svg.appendChild(circle);

    // Nhóm thông tin ghế
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('data-seat-info',i);
    g.setAttribute('class','seat-info-group');

    const nameText=document.createElementNS('http://www.w3.org/2000/svg','text');
    nameText.setAttribute('x',x);
    nameText.setAttribute('y',y-8);
    nameText.setAttribute('class','seat-label');
    nameText.setAttribute('data-seat-name',i);
    nameText.textContent='Trống';

    const phoneText=document.createElementNS('http://www.w3.org/2000/svg','text');
    phoneText.setAttribute('x',x);
    phoneText.setAttribute('y',y+8);
    phoneText.setAttribute('class','seat-info');
    phoneText.setAttribute('data-seat-phone',i);
    phoneText.textContent='';

    g.appendChild(nameText);
    g.appendChild(phoneText);
    svg.appendChild(g);

    seatElements[i]={circle,nameText,phoneText};
  }
}

function updateSeats(){
  if(!tableState||!dealerName)return;
  const tourTables=tableState.tablesTour||[];
  const dealerMap={'Dealer 1':4,'Dealer 2':5,'Dealer 3':6};
  const expectedTableId=dealerMap[dealerName];

  let activeTable=null;
  tourTables.forEach(t=>{
    if(t.status==='active' && t.id===expectedTableId){
      activeTable=t;
    }
  });

  const allSeats=activeTable?activeTable.seats||[]:[...new Array(9)].map(()=>'');

  for(let i=0;i<9;i++){
    const playerName=allSeats[i]||'';
    const phone=playerName?getCustomerPhone(playerName):'';
    const el=seatElements[i];
    if(!el)continue;

    if(playerName){
      el.circle.setAttribute('fill','#228844');
      el.circle.setAttribute('stroke','#44ff66');
      el.circle.setAttribute('filter','drop-shadow(0 0 15px rgba(68,255,102,0.6))');
      el.nameText.textContent=playerName;
      el.phoneText.textContent=phone;
    } else {
      el.circle.setAttribute('fill','#001a0d');
      el.circle.setAttribute('stroke','#004d1a');
      el.circle.setAttribute('filter','none');
      el.nameText.textContent='Trống';
      el.phoneText.textContent='';
    }
  }
}

function handleSeatClick(seatIdx){
  if(!tableState||!dealerName)return;
  const tourTables=tableState.tablesTour||[];
  const dealerMap={'Dealer 1':4,'Dealer 2':5,'Dealer 3':6};
  const tableId=dealerMap[dealerName];
  const table=tourTables.find(t=>t.id===tableId);
  if(!table||!table.seats)return;

  const playerName=table.seats[seatIdx];
  if(playerName){
    openRemoveModal(playerName,seatIdx);
  }
}

function startTimer(){
  stopSound();
  stopVibration();
  timerRemain=timerDuration;
  timerRunning=true;
  updateDisplay();
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    if(!timerRunning)return;
    if(timerRemain>0)timerRemain--;
    updateDisplay();
    if(timerRemain===10)doVibrate([200,100,200]);
    if(timerRemain===3)startContinuousVibration();
    if(timerRemain===0){
      playSound(); // Âm thanh bắt đầu lên, timer giữ yên ở 0
    }
  },1000);
}

function startContinuousVibration(){
  stopVibration();
  vibrationInterval=setInterval(()=>{
    doVibrate([150,100]);
  },250);
}

function stopVibration(){
  if(vibrationInterval){
    clearInterval(vibrationInterval);
    vibrationInterval=null;
  }
  doVibrate(0);
}

function doVibrate(pattern){
  if(!navigator.vibrate)return;
  try{navigator.vibrate(pattern);}catch(e){console.log('Vibration not supported:',e);}
}

function updateDisplay(){
  const el=document.getElementById('timer-text');
  el.textContent=String(timerRemain);

  let className='timer-text';
  if(timerRemain<=3&&timerRemain>0) className+=' danger';
  else if(timerRemain===10) className+=' blink';
  else if(timerRemain<10&&timerRemain>3) className+=' warn';
  el.className=className;
}

function openSettings(){
  document.getElementById('settings-modal').classList.add('show');
  document.getElementById('timer-input').focus();
}

function closeSettings(){
  document.getElementById('settings-modal').classList.remove('show');
}

function setTimerDuration(){
  const val=parseInt(document.getElementById('timer-input').value)||30;
  if(val<5||val>300){alert('5-300 giây!');return;}
  timerDuration=val;
  closeSettings();
  startTimer();
}

function togglePauseTimer(){
  timerRunning=!timerRunning;
}

// Setup double-tap handler for timer
let timerTapCount=0,timerTapTimeout;
setTimeout(()=>{
  const timerTouch=document.getElementById('timer-touch');
  if(timerTouch){
    timerTouch.addEventListener('click',()=>{
      timerTapCount++;
      if(timerTapCount===1){
        timerTapTimeout=setTimeout(()=>{timerTapCount=0;},300);
      } else if(timerTapCount===2){
        clearTimeout(timerTapTimeout);
        timerTapCount=0;
        togglePauseTimer();
      }
    });
  }
},100);

function openRemoveModal(playerName,seatIdx){
  selectedPlayerName=playerName;
  selectedSeatIndex=seatIdx;
  document.getElementById('remove-player-name').textContent=playerName;
  document.getElementById('remove-player-modal').classList.add('show');
}

function closeRemoveModal(){
  selectedPlayerName='';
  selectedSeatIndex=-1;
  document.getElementById('remove-player-modal').classList.remove('show');
}

async function confirmRemovePlayer(){
  if(!selectedPlayerName||selectedSeatIndex<0||!dealerName)return;
  const tourTables=tableState.tablesTour||[];
  const dealerMap={'Dealer 1':4,'Dealer 2':5,'Dealer 3':6};
  const tableId=dealerMap[dealerName];
  const table=tourTables.find(t=>t.id===tableId);
  if(!table||!table.seats)return;

  table.seats[selectedSeatIndex]='';

  try{
    await fetch(API+'/table-state',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(tableState)
    });
    closeRemoveModal();
    await loadState();
  }catch(e){console.error(e);}
}

function playSound(){
  function beep(){
    try{
      if(audioCtx.state==='suspended'){
        audioCtx.resume().then(()=>doBeep());
      } else {
        doBeep();
      }
    }catch(e){console.log('Audio error:',e);}
  }

  function doBeep(){
    try{
      const o=audioCtx.createOscillator();
      const g=audioCtx.createGain();
      o.frequency.value=1200;
      o.connect(g);
      g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.3,audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.15);
      o.start();
      o.stop(audioCtx.currentTime+0.15);
    }catch(e){console.log('Beep failed:',e);}
  }

  beep();
  soundBeepInterval=setInterval(beep,250);
}

function stopSound(){
  if(soundBeepInterval){
    clearInterval(soundBeepInterval);
    soundBeepInterval=null;
  }
}

let touchStartX=0,touchStartY=0;
document.addEventListener('touchstart',e=>{
  touchStartX=e.touches[0].clientX;
  touchStartY=e.touches[0].clientY;
});
document.addEventListener('touchend',e=>{
  if(document.getElementById('main-screen').style.display!=='flex')return;
  const touchEndX=e.changedTouches[0].clientX;
  const touchEndY=e.changedTouches[0].clientY;
  const distX=Math.abs(touchEndX-touchStartX);
  const distY=Math.abs(touchEndY-touchStartY);

  // Swipe: distance > 100px, chủ yếu ngang
  if(distX>100 && distX>distY){
    timerRunning=false;
    stopSound();
    stopVibration();
    startTimer(); // Reset timer lại từ đầu
  }
});

['click','touchstart','keydown'].forEach(event=>{
  document.addEventListener(event,()=>{
    if(audioCtx.state==='suspended'){
      audioCtx.resume().catch(e=>console.log('AudioContext resume failed:',e));
    }
  },{once:true});
});

initLogin();
</script>
</body>
</html>
